name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vyra-store-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release keystore
        id: signing
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VYRA_KEYSTORE_BASE64: ${{ secrets.VYRA_KEYSTORE_BASE64 }}
          VYRA_KEYSTORE_PASSWORD: ${{ secrets.VYRA_KEYSTORE_PASSWORD }}
          VYRA_KEY_ALIAS: ${{ secrets.VYRA_KEY_ALIAS }}
          VYRA_KEY_PASSWORD: ${{ secrets.VYRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VYRA_KEYSTORE_BASE64" || (echo "Missing VYRA_KEYSTORE_BASE64" >&2; exit 1)
          test -n "$VYRA_KEYSTORE_PASSWORD" || (echo "Missing VYRA_KEYSTORE_PASSWORD" >&2; exit 1)
          test -n "$VYRA_KEY_ALIAS" || (echo "Missing VYRA_KEY_ALIAS" >&2; exit 1)
          test -n "$VYRA_KEY_PASSWORD" || (echo "Missing VYRA_KEY_PASSWORD" >&2; exit 1)
          echo "$VYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vyra-upload-key.jks"
          test -s "$RUNNER_TEMP/vyra-upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/vyra-upload-key.jks" -storepass "$VYRA_KEYSTORE_PASSWORD" -alias "$VYRA_KEY_ALIAS" >/dev/null
          echo "VYRA_KEYSTORE_FILE=$RUNNER_TEMP/vyra-upload-key.jks" >> "$GITHUB_ENV"
          echo "VYRA_KEYSTORE_PASSWORD=$VYRA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "VYRA_KEY_ALIAS=$VYRA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "VYRA_KEY_PASSWORD=$VYRA_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && steps.signing.outcome == 'success'
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        if: github.event_name != 'pull_request' && steps.signing.outcome == 'success'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Publish signed APK as GitHub Release
        if: github.event_name == 'push' && steps.signing.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --title "VYRA Store $VERSION_NAME" \
            --notes "VYRA Store $VERSION_NAME: real APK download with live liquid-glass progress and SHA-256 verification. APK built and signature-verified by Android CI."

      - name: Upload signed release APK for internal verification only
        if: github.event_name != 'pull_request' && steps.signing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vyra-store-signed-release-internal
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vyra-upload-key.jks"

      - name: Report missing release signing
        if: github.event_name != 'pull_request' && steps.signing.outcome != 'success'
        run: |
          echo "## Release APK not created" >> "$GITHUB_STEP_SUMMARY"
          echo "The debug APK was uploaded, but release signing failed or its secrets were unavailable. No signed release APK was produced." >> "$GITHUB_STEP_SUMMARY"
          exit 1
